<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu Audio - 3Speak & IPFS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HLS.js para soportar el streaming nativo m3u8 de 3Speak -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-6 pb-28">

  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
      <i data-lucide="radio" class="text-indigo-500"></i> Nimbu Web3 Player
    </h1>

    <!-- Botones de Fuentes -->
    <div class="flex flex-wrap gap-2">
      <button onclick="fetch3SpeakAudio()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
        <i data-lucide="play-circle" class="w-4 h-4"></i> Cargar de 3Speak
      </button>

      <button onclick="importPinataFiles()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
        <i data-lucide="database" class="w-4 h-4"></i> Importar de Pinata
      </button>
    </div>

    <!-- Lista de reproducción -->
    <div id="playlist" class="space-y-2">
      <p id="statusMsg" class="text-slate-500 text-sm">Haz clic en "Cargar de 3Speak" para traer audios recientes...</p>
    </div>
  </div>

  <!-- Reproductor Fijo -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4 backdrop-blur-md">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="w-1/2">
        <div id="currentInfo" class="text-xs font-bold text-white truncate">Ninguna pista seleccionada</div>
        <div id="currentAuthor" class="text-[10px] text-indigo-400 font-mono">---</div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="skip(-1)" class="p-2 hover:bg-slate-800 rounded-full"><i data-lucide="skip-back"></i></button>
        <button id="mainPlayBtn" onclick="togglePlay()" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full"><i data-lucide="play"></i></button>
        <button onclick="skip(1)" class="p-2 hover:bg-slate-800 rounded-full"><i data-lucide="skip-forward"></i></button>
      </div>
    </div>
    <audio id="audioEngine" class="hidden"></audio>
  </footer>

  <script>
    let playlist = [];
    let curIdx = 0;
    const audio = document.getElementById('audioEngine');
    const playBtn = document.getElementById('mainPlayBtn');
    let hls = null;

    // --- 1. CARGAR DESDE 3SPEAK (vía API Hive) ---
    async function fetch3SpeakAudio() {
      document.getElementById('statusMsg').innerText = "Conectando con 3Speak / Hive...";
      
      try {
        const response = await fetch('https://api.hive.blog', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: "2.0",
            method: "condenser_api.get_discussions_by_created",
            params: [{ tag: "3speak", limit: 20 }],
            id: 1
          })
        });

        const { result } = await response.json();
        
        const imported3Speak = [];

        result.forEach(post => {
          try {
            const meta = JSON.parse(post.json_metadata || "{}");
            // Verificar si el post proviene de 3Speak
            if (meta.app && meta.app.includes('3speak')) {
              let streamUrl = null;

              // Opción A: Enlace HLS directo (.m3u8) proporcionado por 3Speak
              if (meta.video && meta.video.info && meta.video.info.file) {
                const permlink = meta.video.info.file.replace('.m3u8', '');
                streamUrl = `https://encoder.3speak.tv/play?v=${post.author}/${permlink}`;
              } 
              // Opción B: Hash IPFS embebido
              else if (meta.video && meta.video.info && meta.video.info.ipfs) {
                streamUrl = `https://ipfs.3speak.tv/ipfs/${meta.video.info.ipfs}`;
              }

              if (streamUrl) {
                imported3Speak.push({
                  title: post.title,
                  author: "@" + post.author,
                  url: streamUrl,
                  source: '3Speak'
                });
              }
            }
          } catch (err) {
            // Ignorar errores de parsing individuales
          }
        });

        if (imported3Speak.length > 0) {
          playlist = [...playlist, ...imported3Speak];
          renderList();
        } else {
          document.getElementById('statusMsg').innerText = "No se encontraron streams válidos en los posts recientes de 3Speak.";
        }

      } catch (e) {
        document.getElementById('statusMsg').innerText = "Error consultando los servidores de Hive/3Speak.";
      }
    }

    // --- 2. IMPORTAR DESDE PINATA ---
    async function importPinataFiles() {
      const apiKey = prompt("Ingresa tu Pinata API Key:");
      const apiSecret = prompt("Ingresa tu Pinata API Secret:");
      if (!apiKey || !apiSecret) return;

      document.getElementById('statusMsg').innerText = "Cargando archivos de Pinata...";

      try {
        const response = await fetch("https://api.pinata.cloud/data/pinList?status=pinned", {
          method: "GET",
          headers: { "pinata_api_key": apiKey, "pinata_secret_api_key": apiSecret }
        });
        
        const data = await response.json();
        const pinataTracks = data.rows.map(item => ({
          title: item.metadata?.name || "Audio IPFS",
          author: "Pinata User",
          url: `https://gateway.pinata.cloud/ipfs/${item.ipfs_pin_hash}`,
          source: 'Pinata'
        }));

        playlist = [...playlist, ...pinataTracks];
        renderList();
      } catch (e) {
        alert("Error al conectar con Pinata");
      }
    }

    // --- 3. RENDERIZADO DE LISTA ---
    function renderList() {
      const container = document.getElementById('playlist');
      container.innerHTML = playlist.map((t, i) => `
        <div class="p-3 bg-slate-900 rounded-lg flex justify-between items-center border border-slate-800 hover:border-slate-700 transition">
          <div class="truncate mr-4">
            <h3 class="text-sm font-bold truncate text-slate-200">${t.title}</h3>
            <p class="text-[10px] text-indigo-400 font-mono">${t.source} • ${t.author}</p>
          </div>
          <button onclick="playTrack(${i})" class="text-xs bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white px-3 py-1.5 rounded-lg border border-indigo-500/30 transition shrink-0">
            Reproducir
          </button>
        </div>
      `).join('');
      document.getElementById('statusMsg').innerText = "";
    }

    // --- 4. MOTOR DE REPRODUCCIÓN (Compatibilidad HLS/IPFS) ---
    async function playTrack(i) {
      curIdx = i;
      const track = playlist[i];
      document.getElementById('currentInfo').innerText = track.title;
      document.getElementById('currentAuthor').innerText = `${track.source} • ${track.author}`;

      // Si el stream es un manifiesto HLS (.m3u8 de 3Speak)
      if (Hls.isSupported() && track.url.includes('.m3u8')) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(track.url);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
      } 
      // Si es un audio directo MP3/IPFS
      else {
        if (hls) hls.destroy();
        audio.src = track.url;
        await audio.play();
      }

      playBtn.innerHTML = '<i data-lucide="pause"></i>';
      lucide.createIcons();
    }

    function togglePlay() {
      if (audio.paused) { 
        audio.play(); 
        playBtn.innerHTML = '<i data-lucide="pause"></i>'; 
      } else { 
        audio.pause(); 
        playBtn.innerHTML = '<i data-lucide="play"></i>'; 
      }
      lucide.createIcons();
    }

    function skip(s) { 
      if (playlist.length === 0) return;
      let next = (curIdx + s + playlist.length) % playlist.length;
      playTrack(next);
    }

    lucide.createIcons();
  </script>
</body>
</html>
