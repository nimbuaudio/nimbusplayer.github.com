<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu Audio - IPFS & Hive Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
    input[type=range] { accent-color: #6366f1; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-36">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30 px-6 py-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i data-lucide="cloud-lightning" class="w-5 h-5"></i>
        </div>
        <h1 class="font-extrabold text-lg tracking-wide text-white">Nimbu Web3 Audio Engine</h1>
      </div>
      <div id="connectionNode" class="text-xs text-slate-500 font-mono">Nodo: Conectando...</div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full px-6 py-8 flex-1 space-y-10">

    <!-- Formulario de Subida a IPFS -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex items-center gap-2 mb-2">
        <i data-lucide="upload" class="w-4 h-4 text-indigo-400"></i>
        <h2 class="text-sm font-bold text-white uppercase tracking-wider">Subir pista a IPFS (Pinata)</h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Título de la Pista</label>
          <input type="text" id="trackTitleInput" placeholder="Ej: Mi Canción Hive" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre de Usuario (Artista)</label>
          <input type="text" id="artistInput" placeholder="Ej: usuario_hive" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Archivo de Audio (Cualquier formato)</label>
        <input type="file" id="audioFileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.webm" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600/20 file:text-indigo-400 hover:file:bg-indigo-600/30 cursor-pointer">
      </div>

      <button onclick="handleUploadProcess()" id="uploadBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg transition flex items-center justify-center gap-2">
        <i data-lucide="cloud-upload" class="w-4 h-4"></i> Procesar y Subir a IPFS
      </button>

      <!-- Consola de Salida -->
      <div id="uploadStatus" class="hidden p-4 bg-slate-950 border border-slate-800 rounded-xl text-xs space-y-2 font-mono"></div>
    </section>

    <!-- Reproductor de Posts de Hive -->
    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Pistas encontradas en Hive</h2>
        <button onclick="loadHiveAudio()" class="flex items-center gap-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Recargar Hive
        </button>
      </div>

      <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div id="loader" class="col-span-full py-16 text-center text-slate-500 animate-pulse">
          Buscando audios directos en la blockchain...
        </div>
      </div>
    </section>

  </main>

  <!-- Player Inferior Flotante -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 p-4 backdrop-blur-md z-40">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <div class="flex items-center gap-3 w-full sm:w-1/3 truncate">
        <div class="p-2.5 bg-indigo-950 text-indigo-400 border border-indigo-800/40 rounded-xl shrink-0">
          <i data-lucide="music" class="w-5 h-5"></i>
        </div>
        <div class="truncate">
          <h4 id="playerTrackTitle" class="text-xs font-bold text-white truncate">Ninguna pista seleccionada</h4>
          <p id="playerTrackAuthor" class="text-[10px] text-slate-400 truncate">Esperando acción...</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <button onclick="playRandomTrack()" class="text-slate-400 hover:text-white transition" title="Aleatorio">
          <i data-lucide="shuffle" class="w-4 h-4"></i>
        </button>
        <button onclick="skipTrack(-1)" class="text-slate-300 hover:text-white transition">
          <i data-lucide="skip-back" class="w-5 h-5"></i>
        </button>
        <button id="playBtn" onclick="togglePlayPause()" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition shadow-lg shadow-indigo-600/30">
          <i data-lucide="play" class="w-5 h-5"></i>
        </button>
        <button onclick="skipTrack(1)" class="text-slate-300 hover:text-white transition">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="hidden sm:flex items-center gap-2 w-1/4 justify-end">
        <i data-lucide="volume-2" class="w-4 h-4 text-slate-400"></i>
        <input type="range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" class="w-20">
      </div>

    </div>
    <audio id="audioEngine"></audio>
  </footer>

  <script>
    // Configuration & Globals
    const HIVE_NODES = [
      'https://api.hive.blog',
      'https://api.openhive.network',
      'https://techcoderx.com',
      'https://hive-api.arcange.eu'
    ];
    const SEARCH_TAGS = ["music", "audio", "podcast", "sound"];
    const AUDIO_EXTENSIONS = "mp3|wav|ogg|m4a|aac|flac|webm|opus|oga|weba|wma|m4b";

    let playlist = [];
    let currentIndex = 0;

    const audio = document.getElementById('audioEngine');
    const playBtn = document.getElementById('playBtn');
    const playerTrackTitle = document.getElementById('playerTrackTitle');
    const playerTrackAuthor = document.getElementById('playerTrackAuthor');

    lucide.createIcons();

    // --- MÓDULO 1: SUBIDA A IPFS (API KEY + SECRET) ---
    async function uploadAudioToIPFS(file, apiKey, apiSecret) {
      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch("https://api.pinata.cloud/pinning/pinFileToIPFS", {
        method: "POST",
        headers: {
          "pinata_api_key": apiKey,
          "pinata_secret_api_key": apiSecret
        },
        body: formData
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || "Fallo en las credenciales de Pinata o en la conexión.");
      }

      const data = await response.json();
      return `https://gateway.pinata.cloud/ipfs/${data.IpfsHash}`;
    }

    async function uploadMetadataToIPFS(audioUrl, title, artist, apiKey, apiSecret) {
      const metadata = {
        name: title,
        artist: artist,
        audio_url: audioUrl,
        created_at: new Date().toISOString(),
        type: "hive_audio_track"
      };

      const response = await fetch("https://api.pinata.cloud/pinning/pinJSONToIPFS", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "pinata_api_key": apiKey,
          "pinata_secret_api_key": apiSecret
        },
        body: JSON.stringify({
          pinataContent: metadata,
          pinataMetadata: { name: `${title}_metadata.json` }
        })
      });

      if (!response.ok) throw new Error("Fallo en la subida de los metadatos JSON.");
      const data = await response.json();
      return `https://gateway.pinata.cloud/ipfs/${data.IpfsHash}`;
    }

    async function handleUploadProcess() {
      const apiKey = prompt("Ingresa tu Pinata API Key:");
      const apiSecret = prompt("Ingresa tu Pinata API Secret:");
      
      const title = document.getElementById('trackTitleInput').value.trim();
      const artist = document.getElementById('artistInput').value.trim();
      const fileInput = document.getElementById('audioFileInput');
      const statusBox = document.getElementById('uploadStatus');

      if (!apiKey || !apiSecret) return alert("Se requieren las claves API de Pinata.");
      if (!title || !artist || !fileInput.files[0]) return alert("Completa el título, autor y archivo.");

      statusBox.classList.remove('hidden');
      statusBox.innerHTML = `<p class="text-amber-400">⏳ Conectando con IPFS y subiendo audio...</p>`;

      try {
        const audioUrl = await uploadAudioToIPFS(fileInput.files[0], apiKey, apiSecret);
        statusBox.innerHTML += `<p class="text-emerald-400">✓ Audio alojado en IPFS: <a href="${audioUrl}" target="_blank" class="underline font-bold">${audioUrl}</a></p>`;
        
        statusBox.innerHTML += `<p class="text-amber-400">⏳ Creando metadatos JSON...</p>`;
        const metadataUrl = await uploadMetadataToIPFS(audioUrl, title, artist, apiKey, apiSecret);
        
        statusBox.innerHTML += `<p class="text-emerald-400">✓ JSON listo: <a href="${metadataUrl}" target="_blank" class="underline font-bold">${metadataUrl}</a></p>`;
        statusBox.innerHTML += `
          <div class="mt-3 p-3 bg-indigo-950 border border-indigo-800 rounded-lg text-slate-300">
            <p class="font-bold text-white mb-1">¡Audio Listo!</p>
            <p>Copia este enlace para pegarlo en tu post de Hive:</p>
            <input readonly value="${audioUrl}" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 mt-1 text-[11px] text-indigo-300 font-mono">
          </div>
        `;

        // Añadir a la lista activa para reproducirlo inmediatamente
        playlist.unshift({ author: artist, title: title, streamUrl: audioUrl });
        renderPlaylist();
        playIndex(0);
      } catch (err) {
        statusBox.innerHTML += `<p class="text-rose-500">❌ Error: ${err.message}</p>`;
      }
    }

    // --- MÓDULO 2: LECTURA Y REPRODUCCIÓN DE HIVE ---
    function isDirectAudioUrl(url) {
      if (!url || typeof url !== 'string') return false;
      if (/youtube\.com|youtu\.be|3speak\.tv\/watch|soundcloud\.com/i.test(url)) return false;
      const regexCheck = new RegExp(`\\.(${AUDIO_EXTENSIONS})(\\?.*)?$`, 'i');
      return regexCheck.test(url) || url.includes('/ipfs/');
    }

    function extractAudioFromPost(post) {
      const regex = new RegExp(`(https?:\\/\\/[^\\s"']+\\.(${AUDIO_EXTENSIONS})(\\?[^\\s"']*)?)|(https?:\\/\\/[^\\s"']+\\/ipfs\\/[a-zA-Z0-9]+)`, 'gi');
      const bodyMatches = post.body ? post.body.match(regex) : null;
      if (bodyMatches) {
        const direct = bodyMatches.find(l => isDirectAudioUrl(l));
        if (direct) return direct;
      }

      let meta = {};
      try { meta = typeof post.json_metadata === 'string' ? JSON.parse(post.json_metadata || '{}') : post.json_metadata; } catch(e) {}
      
      if (isDirectAudioUrl(meta?.audio)) return meta.audio;
      if (isDirectAudioUrl(meta?.audio_url)) return meta.audio_url;
      if (isDirectAudioUrl(meta?.music)) return meta.music;
      return null;
    }

    async function hiveRpcCall(body) {
      for (const node of HIVE_NODES) {
        try {
          const res = await fetch(node, {
            method: 'POST',
            body: JSON.stringify(body),
            headers: { 'Content-Type': 'application/json' }
          });
          if (res.ok) {
            document.getElementById('connectionNode').innerText = `Nodo: ${new URL(node).hostname}`;
            return await res.json();
          }
        } catch (e) {}
      }
      throw new Error("Fallo en la comunicación con Hive.");
    }

    async function loadHiveAudio() {
      const feed = document.getElementById('feed');
      feed.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500 animate-pulse">Sintonizando la red Hive...</div>`;

      try {
        const requests = SEARCH_TAGS.map(tag => hiveRpcCall({
          jsonrpc: "2.0",
          method: "condenser_api.get_discussions_by_created",
          params: [{ tag, limit: 15 }],
          id: 1
        }));

        const results = await Promise.allSettled(requests);
        const postMap = new Map();

        results.forEach(res => {
          if (res.status === 'fulfilled' && res.value?.result) {
            res.value.result.forEach(p => postMap.set(p.permlink, p));
          }
        });

        const remoteList = Array.from(postMap.values())
          .map(post => ({
            author: post.author,
            title: post.title,
            streamUrl: extractAudioFromPost(post)
          }))
          .filter(item => !!item.streamUrl);

        playlist = [...playlist, ...remoteList];
        renderPlaylist();
      } catch (err) {
        feed.innerHTML = `<div class="col-span-full py-16 text-center text-rose-500">Error al consultar los nodos de Hive.</div>`;
      }
    }

    function renderPlaylist() {
      const feed = document.getElementById('feed');
      if (playlist.length === 0) {
        feed.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500">No hay audios disponibles actualmente.</div>`;
        return;
      }

      feed.innerHTML = playlist.map((item, idx) => `
        <article class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between hover:border-slate-700 transition">
          <div>
            <span class="text-[10px] font-semibold uppercase tracking-wider text-indigo-400">@${item.author}</span>
            <h3 class="text-sm font-medium text-slate-200 mt-1 line-clamp-2 leading-snug">${item.title}</h3>
          </div>
          <button onclick="playIndex(${idx})" class="mt-4 w-full py-2 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
            <i data-lucide="play" class="w-3.5 h-3.5"></i> Reproducir
          </button>
        </article>
      `).join('');
      lucide.createIcons();
    }

    // --- MÓDULO 3: CONTROLES DE REPRODUCCIÓN ---
    function playIndex(index) {
      if (!playlist[index]) return;
      currentIndex = index;
      const track = playlist[currentIndex];

      audio.src = track.streamUrl;
      playerTrackTitle.innerText = track.title;
      playerTrackAuthor.innerText = `@${track.author}`;

      audio.play().then(() => {
        updatePlayState(true);
      }).catch(e => {
        updatePlayState(false);
      });
    }

    function togglePlayPause() {
      if (!audio.src && playlist.length > 0) { playIndex(0); return; }
      if (audio.paused) { audio.play(); updatePlayState(true); } 
      else { audio.pause(); updatePlayState(false); }
    }

    function skipTrack(step) {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + step + playlist.length) % playlist.length;
      playIndex(currentIndex);
    }

    function playRandomTrack() {
      if (playlist.length === 0) return;
      currentIndex = Math.floor(Math.random() * playlist.length);
      playIndex(currentIndex);
    }

    function setVolume(val) { audio.volume = val; }

    function updatePlayState(isPlaying) {
      playBtn.innerHTML = isPlaying ? '<i data-lucide="pause" class="w-5 h-5"></i>' : '<i data-lucide="play" class="w-5 h-5"></i>';
      lucide.createIcons();
    }

    audio.onerror = () => {
      playerTrackTitle.innerText = "⚠️ Error de reproducción. Saltando...";
      setTimeout(() => skipTrack(1), 1500);
    };

    audio.onended = () => skipTrack(1);

    // Inicializar
    loadHiveAudio();
  </script>
</body>
</html>
