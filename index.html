<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu Audio - 3Speak & Web3 Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-6 pb-28">

  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
      <i data-lucide="radio" class="text-indigo-500"></i> Nimbu Web3 Player
    </h1>

    <!-- Botones -->
    <div class="flex flex-wrap gap-2">
      <button onclick="fetch3SpeakAudio()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
        <i data-lucide="play-circle" class="w-4 h-4"></i> Cargar de 3Speak / Hive
      </button>

      <button onclick="importPinataFiles()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
        <i data-lucide="database" class="w-4 h-4"></i> Importar de Pinata
      </button>
    </div>

    <!-- Lista de reproducción -->
    <div id="playlist" class="space-y-2">
      <p id="statusMsg" class="text-slate-500 text-sm">Presiona "Cargar de 3Speak / Hive" para buscar pistas...</p>
    </div>
  </div>

  <!-- Player Fijo -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4 backdrop-blur-md z-50">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="w-1/2">
        <div id="currentInfo" class="text-xs font-bold text-white truncate">Ninguna pista seleccionada</div>
        <div id="currentAuthor" class="text-[10px] text-indigo-400 font-mono">---</div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="skip(-1)" class="p-2 hover:bg-slate-800 rounded-full"><i data-lucide="skip-back"></i></button>
        <button id="mainPlayBtn" onclick="togglePlay()" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full"><i data-lucide="play"></i></button>
        <button onclick="skip(1)" class="p-2 hover:bg-slate-800 rounded-full"><i data-lucide="skip-forward"></i></button>
      </div>
    </div>
    <audio id="audioEngine" class="hidden"></audio>
  </footer>

  <script>
    let playlist = [];
    let curIdx = 0;
    const audio = document.getElementById('audioEngine');
    const playBtn = document.getElementById('mainPlayBtn');
    let hls = null;

    // Proxies y Gateways para evitar problemas de CORS
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";
    const IPFS_GATEWAYS = ['https://ipfs.io/ipfs/', 'https://gateway.pinata.cloud/ipfs/', 'https://cloudflare-ipfs.com/ipfs/'];

    // --- CARGAR DE 3SPEAK & HIVE MUSIC ---
    async function fetch3SpeakAudio() {
      document.getElementById('statusMsg').innerText = "Buscando pistas en 3Speak y la comunidad de música de Hive...";
      
      try {
        // Consultamos tanto la etiqueta 3speak como la comunidad de música de Hive
        const response = await fetch('https://api.hive.blog', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: "2.0",
            method: "condenser_api.get_discussions_by_created",
            params: [{ tag: "music", limit: 40 }],
            id: 1
          })
        });

        const { result } = await response.json();
        const extracted = [];

        result.forEach(post => {
          try {
            const meta = JSON.parse(post.json_metadata || "{}");
            let mediaUrl = null;
            let isHls = false;

            // 1. Detección de video/audio en 3Speak (.m3u8 / IPFS)
            if (meta.app && meta.app.includes('3speak')) {
              if (meta.video?.info?.file) {
                const file = meta.video.info.file;
                const streamName = file.replace('.m3u8', '');
                mediaUrl = `https://encoder.3speak.tv/play?v=${post.author}/${streamName}`;
                isHls = true;
              } else if (meta.video?.info?.ipfs) {
                mediaUrl = `${IPFS_GATEWAYS[0]}${meta.video.info.ipfs}`;
              }
            }
            
            // 2. Búsqueda de audio embebido directo (MP3, WAV, OGG) en el post
            if (!mediaUrl) {
              const match = post.body.match(/https?:\/\/[^\s"']+\.(mp3|wav|ogg|m3u8)/i);
              if (match) {
                mediaUrl = match[0];
                if (mediaUrl.includes('.m3u8')) isHls = true;
              }
            }

            if (mediaUrl) {
              extracted.push({
                title: post.title,
                author: "@" + post.author,
                url: mediaUrl,
                isHls: isHls,
                source: meta.app && meta.app.includes('3speak') ? '3Speak' : 'Hive Music'
              });
            }
          } catch (err) {}
        });

        if (extracted.length > 0) {
          extracted.forEach(t => {
            if (!playlist.some(p => p.url === t.url)) playlist.push(t);
          });
          renderList();
          document.getElementById('statusMsg').innerText = `✓ Se encontraron ${extracted.length} pistas disponibles.`;
        } else {
          document.getElementById('statusMsg').innerText = "No se encontraron enlaces de audio reproducibles en los posts recientes.";
        }
      } catch (e) {
        console.error(e);
        document.getElementById('statusMsg').innerText = "Error de conexión con la blockchain de Hive.";
      }
    }

    // --- IMPORTAR DE PINATA ---
    async function importPinataFiles() {
      const jwtPrompt = prompt("Ingresa tu Pinata JWT Token:");
      if (!jwtPrompt) return;

      const input = jwtPrompt.trim();
      let headers = input.startsWith("eyJ") 
        ? { "Authorization": `Bearer ${input}` }
        : { "pinata_api_key": input, "pinata_secret_api_key": (prompt("Ingresa tu Pinata API Secret:") || "").trim() };

      document.getElementById('statusMsg').innerText = "Cargando catálogo de Pinata...";

      try {
        const response = await fetch("https://api.pinata.cloud/data/pinList?status=pinned&pageLimit=100", {
          method: "GET",
          headers: headers
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.details || errData.error || JSON.stringify(errData));
        }

        const data = await response.json();
        
        if (!data.rows || data.rows.length === 0) {
          document.getElementById('statusMsg').innerText = "No se encontraron archivos en Pinata.";
          return;
        }

        const pinataTracks = data.rows.map(item => ({
          title: item.metadata?.name || item.ipfs_pin_hash,
          author: "Tu Pinata IPFS",
          url: `${IPFS_GATEWAYS[0]}${item.ipfs_pin_hash}`,
          isHls: false,
          source: 'Pinata'
        }));

        pinataTracks.forEach(t => {
          if (!playlist.some(p => p.url === t.url)) playlist.push(t);
        });

        renderList();
        document.getElementById('statusMsg').innerText = `✓ Se importaron ${pinataTracks.length} archivos de Pinata.`;

      } catch (e) {
        alert(`❌ Error en Pinata:\n${e.message}`);
        document.getElementById('statusMsg').innerText = "Error al conectar con Pinata.";
      }
    }

    // --- RENDERIZADO Y CONTROL ---
    function renderList() {
      const container = document.getElementById('playlist');
      if (playlist.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-sm">Lista vacía.</p>`;
        return;
      }

      container.innerHTML = playlist.map((t, i) => `
        <div class="p-3 bg-slate-900 rounded-lg flex justify-between items-center border border-slate-800 hover:border-slate-700 transition">
          <div class="truncate mr-4">
            <h3 class="text-sm font-bold truncate text-slate-200">${t.title}</h3>
            <p class="text-[10px] text-indigo-400 font-mono">${t.source} • ${t.author}</p>
          </div>
          <button onclick="playTrack(${i})" class="text-xs bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white px-3 py-1.5 rounded-lg border border-indigo-500/30 transition shrink-0">
            Reproducir
          </button>
        </div>
      `).join('');
    }

    async function playTrack(i) {
      curIdx = i;
      const track = playlist[i];
      document.getElementById('currentInfo').innerText = track.title;
      document.getElementById('currentAuthor').innerText = `${track.source} • ${track.author}`;

      audio.onerror = () => {
        document.getElementById('currentInfo').innerText = "❌ Bloqueo de CORS o servidor no disponible.";
        playBtn.innerHTML = '<i data-lucide="play"></i>';
      };

      // Si la pista requiere streaming HLS (3Speak)
      if (track.isHls || track.url.includes('.m3u8')) {
        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls({
            // Habilitar CORS Bypass interno en HLS
            xhrSetup: function (xhr, url) {
              xhr.withCredentials = false;
            }
          });
          hls.loadSource(track.url);
          hls.attachMedia(audio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
          hls.on(Hls.Events.ERROR, (evt, data) => {
            if (data.fatal) {
              // Si falla el origen de 3speak, probamos pasar la URL por un proxy CORS
              hls.loadSource(CORS_PROXY + encodeURIComponent(track.url));
            }
          });
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          audio.src = track.url;
          await audio.play();
        }
      } 
      // Audio estándar (MP3 / IPFS Directo)
      else {
        if (hls) hls.destroy();
        audio.src = track.url;
        await audio.play();
      }

      playBtn.innerHTML = '<i data-lucide="pause"></i>';
      lucide.createIcons();
    }

    function togglePlay() {
      if (audio.paused) { audio.play(); playBtn.innerHTML = '<i data-lucide="pause"></i>'; }
      else { audio.pause(); playBtn.innerHTML = '<i data-lucide="play"></i>'; }
      lucide.createIcons();
    }

    function skip(s) { 
      if (playlist.length === 0) return;
      playTrack((curIdx + s + playlist.length) % playlist.length);
    }

    lucide.createIcons();
  </script>
</body>
</html>
