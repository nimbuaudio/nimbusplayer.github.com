<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nimbu Player Directo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-6">
  <div class="max-w-md mx-auto space-y-4">
    <h1 class="text-xl font-bold">Nimbu Direct Audio Player</h1>
    
    <div class="space-y-2">
      <input id="titleInput" type="text" placeholder="Título de la canción" class="w-full p-2 bg-slate-900 border border-slate-800 rounded">
      <input id="urlInput" type="text" placeholder="URL o CID de IPFS (ej: https://...mp3)" class="w-full p-2 bg-slate-900 border border-slate-800 rounded">
      <button onclick="addTrack()" class="w-full bg-indigo-600 p-2 rounded font-bold">Añadir a la lista</button>
    </div>

    <div id="playlist" class="space-y-2 mt-4"></div>
    <audio id="audio" controls class="w-full mt-4"></audio>
  </div>

  <script>
    let playlist = [];

    function addTrack() {
      const title = document.getElementById('titleInput').value || 'Sin título';
      let url = document.getElementById('urlInput').value.trim();

      // Si ingresan solo el Hash CID de IPFS
      if (url.startsWith('Qm') || url.startsWith('bafy')) {
        url = `https://ipfs.io/ipfs/${url}`;
      }

      if (!url) return alert('Ingresa una URL o CID válido');

      playlist.push({ title, url });
      render();
    }

    function render() {
      document.getElementById('playlist').innerHTML = playlist.map((t, i) => `
        <div class="p-2 bg-slate-900 border border-slate-800 rounded flex justify-between items-center">
          <span class="text-sm truncate w-2/3">${t.title}</span>
          <button onclick="play(${i})" class="text-xs bg-indigo-600 px-3 py-1 rounded">Play</button>
        </div>
      `).join('');
    }

    function play(i) {
      const player = document.getElementById('audio');
      player.src = playlist[i].url;
      player.play();
    }
  </script>
</body>
</html>
