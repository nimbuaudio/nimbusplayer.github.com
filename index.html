<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu Audio - IPFS & Hive Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
    input[type=range] { accent-color: #6366f1; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-36">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30 px-6 py-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i data-lucide="cloud-lightning" class="w-5 h-5"></i>
        </div>
        <h1 class="font-extrabold text-lg tracking-wide text-white">Nimbu Web3 Audio Engine</h1>
      </div>
      <div id="connectionNode" class="text-xs text-slate-500 font-mono">Nodo: Listo</div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full px-6 py-8 flex-1 space-y-10">

    <!-- Formulario -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-2">Subir / Importar</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
         <input type="text" id="trackTitleInput" placeholder="Título" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
         <input type="text" id="artistInput" placeholder="Autor" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
      </div>
      <input type="file" id="audioFileInput" accept="audio/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:bg-indigo-600/20 file:border-0 file:rounded-lg file:text-indigo-400 cursor-pointer">
      <button onclick="handleUploadProcess()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg transition">Procesar y Subir a IPFS</button>
      <div id="uploadStatus" class="hidden p-3 bg-slate-950 rounded-lg text-xs font-mono"></div>
    </section>

    <!-- Playlist Section -->
    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Tu Biblioteca</h2>
        <div class="flex gap-2">
          <button onclick="importPinataFiles()" class="text-xs bg-indigo-900/50 hover:bg-indigo-800 text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-700 transition">
            <i data-lucide="database" class="w-3.5 h-3.5 inline"></i> Importar de Pinata
          </button>
          <button onclick="clearLocalStorageAudios()" class="text-xs bg-rose-950/40 text-rose-300 px-3 py-1.5 rounded-lg border border-rose-800/40">Limpiar</button>
        </div>
      </div>
      <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 p-4 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="w-1/3 truncate"><h4 id="playerTrackTitle" class="text-xs font-bold text-white">Ninguna pista</h4></div>
      <div class="flex gap-4">
        <button onclick="skipTrack(-1)"><i data-lucide="skip-back"></i></button>
        <button id="playBtn" onclick="togglePlayPause()"><i data-lucide="play"></i></button>
        <button onclick="skipTrack(1)"><i data-lucide="skip-forward"></i></button>
      </div>
      <input type="range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" class="w-20">
    </div>
    <audio id="audioEngine"></audio>
  </footer>

  <script>
    const IPFS_GATEWAYS = ['https://gateway.pinata.cloud/ipfs/', 'https://ipfs.io/ipfs/'];
    let playlist = [];
    let pinataImportedTracks = [];
    let currentIndex = 0;
    const audio = document.getElementById('audioEngine');
    const playBtn = document.getElementById('playBtn');

    // --- IMPORTAR DE PINATA ---
    async function importPinataFiles() {
      const apiKey = prompt("Ingresa tu Pinata API Key:");
      const apiSecret = prompt("Ingresa tu Pinata API Secret:");
      if (!apiKey || !apiSecret) return;

      try {
        const response = await fetch("https://api.pinata.cloud/data/pinList?status=pinned", {
          method: "GET",
          headers: { "pinata_api_key": apiKey, "pinata_secret_api_key": apiSecret }
        });
        const data = await response.json();
        
        // Mapear los resultados de Pinata a nuestro formato de track
        pinataImportedTracks = data.rows.map(item => ({
          author: "Tu cuenta Pinata",
          title: item.metadata?.name || item.ipfs_pin_hash,
          streamUrl: `https://gateway.pinata.cloud/ipfs/${item.ipfs_pin_hash}`,
          ipfsHash: item.ipfs_pin_hash,
          isUserUploaded: true
        }));
        
        rebuildPlaylist();
        alert(`Se importaron ${pinataImportedTracks.length} archivos desde Pinata.`);
      } catch (err) {
        alert("Error al conectar con Pinata: " + err.message);
      }
    }

    function rebuildPlaylist() {
      const local = JSON.parse(localStorage.getItem('nimbu_uploaded_tracks_v6') || '[]');
      playlist = [...local, ...pinataImportedTracks];
      renderPlaylist();
    }

    function renderPlaylist() {
      const feed = document.getElementById('feed');
      feed.innerHTML = playlist.map((item, idx) => `
        <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <h3 class="text-xs font-bold text-slate-200">${item.title}</h3>
          <p class="text-[10px] text-indigo-400">@${item.author}</p>
          <button onclick="playIndex(${idx})" class="mt-4 w-full py-2 bg-indigo-600/10 text-indigo-400 rounded-lg text-xs">Reproducir</button>
        </article>
      `).join('');
    }

    // Funciones básicas de reproducción
    async function playIndex(index) {
        currentIndex = index;
        const track = playlist[currentIndex];
        document.getElementById('playerTrackTitle').innerText = track.title;
        audio.src = track.streamUrl;
        await audio.play();
        playBtn.innerHTML = '<i data-lucide="pause"></i>';
        lucide.createIcons();
    }

    function togglePlayPause() {
        if (audio.paused) { audio.play(); playBtn.innerHTML = '<i data-lucide="pause"></i>'; }
        else { audio.pause(); playBtn.innerHTML = '<i data-lucide="play"></i>'; }
    }

    function setVolume(v) { audio.volume = v; }
    function skipTrack(s) { playIndex((currentIndex + s + playlist.length) % playlist.length); }

    // --- CARGA INICIAL ---
    rebuildPlaylist();
    lucide.createIcons();

    // Reutiliza las funciones handleUploadProcess del código anterior
    // (Omitidas para brevedad, pero funcionan igual)
  </script>
</body>
</html>
