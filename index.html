<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbu Audio - Hive & IPFS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-6">

  <div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
      <i data-lucide="radio" class="text-indigo-500"></i> Nimbu Hive Player
    </h1>

    <div class="flex gap-2">
      <button onclick="fetchHiveMusic()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        Cargar Tendencia #music de Hive
      </button>
      <button onclick="importPinataFiles()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        Importar de Pinata
      </button>
    </div>

    <div id="playlist" class="space-y-2">
      <p id="statusMsg" class="text-slate-500 text-sm">Presiona "Cargar" para buscar música...</p>
    </div>
  </div>

  <!-- Player Fijo -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div id="currentInfo" class="text-xs font-medium truncate w-1/2">Ninguna pista</div>
      <div class="flex gap-4">
        <button onclick="skip(-1)"><i data-lucide="skip-back"></i></button>
        <button id="mainPlayBtn" onclick="togglePlay()"><i data-lucide="play"></i></button>
        <button onclick="skip(1)"><i data-lucide="skip-forward"></i></button>
      </div>
    </div>
    <audio id="audioEngine" class="hidden"></audio>
  </footer>

  <script>
    let playlist = [];
    let curIdx = 0;
    const audio = document.getElementById('audioEngine');
    const playBtn = document.getElementById('mainPlayBtn');

    // 1. Cargar posts reales de #music en Hive
    async function fetchHiveMusic() {
      document.getElementById('statusMsg').innerText = "Buscando en Hive...";
      try {
        const response = await fetch('https://api.hive.blog', {
          method: 'POST',
          body: JSON.stringify({
            jsonrpc: "2.0",
            method: "condenser_api.get_discussions_by_created",
            params: [{ tag: "music", limit: 10 }],
            id: 1
          })
        });
        const { result } = await response.json();
        
        playlist = result.map(post => {
          // Extraer links de audio de los metadatos o cuerpo
          const meta = JSON.parse(post.json_metadata || "{}");
          const url = (meta.audio_url || meta.ipfs || "") || (post.body.match(/https?:\/\/[^\s]+\.(mp3|wav|ogg)/) || [])[0];
          return { title: post.title, author: post.author, url: url };
        }).filter(item => item.url);

        renderList();
      } catch (e) {
        document.getElementById('statusMsg').innerText = "Error conectando a Hive.";
      }
    }

    // 2. Renderizar y manejar errores de carga
    function renderList() {
      const container = document.getElementById('playlist');
      container.innerHTML = playlist.map((t, i) => `
        <div class="p-3 bg-slate-900 rounded-lg flex justify-between items-center border border-slate-800">
          <div>
            <h3 class="text-sm font-bold truncate w-64">${t.title}</h3>
            <p class="text-xs text-indigo-400">@${t.author}</p>
          </div>
          <button onclick="playTrack(${i})" class="text-xs bg-slate-800 px-3 py-1 rounded">Play</button>
        </div>
      `).join('');
      document.getElementById('statusMsg').innerText = playlist.length > 0 ? "" : "No se encontraron audios.";
    }

    // 3. Reproducción inteligente
    async function playTrack(i) {
      curIdx = i;
      const track = playlist[i];
      document.getElementById('currentInfo').innerText = track.title;
      
      audio.src = track.url;
      audio.onerror = () => {
        document.getElementById('currentInfo').innerText = "❌ Error al cargar archivo";
        playBtn.innerHTML = '<i data-lucide="play"></i>';
      };
      
      try {
        await audio.play();
        playBtn.innerHTML = '<i data-lucide="pause"></i>';
      } catch (e) {
        alert("El navegador bloqueó la reproducción automática.");
      }
    }

    function togglePlay() {
      if(audio.paused) { audio.play(); playBtn.innerHTML = '<i data-lucide="pause"></i>'; }
      else { audio.pause(); playBtn.innerHTML = '<i data-lucide="play"></i>'; }
    }

    function skip(s) { 
      let next = (curIdx + s + playlist.length) % playlist.length;
      playTrack(next);
    }

    // Inicializar iconos
    lucide.createIcons();
  </script>
</body>
</html>
